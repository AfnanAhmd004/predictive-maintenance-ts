[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Anomaly detection for predictive maintenance on industrial sensor time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
